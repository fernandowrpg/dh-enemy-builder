# Ao publicar uma tag vX.Y.Z, gera o module.zip e anexa module.json + module.zip à release.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Ajusta versão e links do manifesto
        run: node tools/stamp-manifest.mjs "${GITHUB_REF_NAME#v}" "https://github.com/${GITHUB_REPOSITORY}" "${GITHUB_REF_NAME}"
      - run: zip -r module.zip module.json LICENSE README.md index.html scripts styles data/README.md
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            module.json
            module.zip
